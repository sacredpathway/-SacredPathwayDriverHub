name: iOS build and unit tests

on:
  push:
    branches: [feature/settlements-cloud-build]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-build-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          xcodebuild -version
          xcrun simctl list runtimes | grep iOS || true

      - name: Pick simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json,sys
          d=json.load(sys.stdin)["devices"]
          rts=sorted([k for k in d if "iOS" in k], reverse=True)
          for rt in rts:
              for dev in d[rt]:
                  if dev["name"].startswith("iPhone"):
                      print(dev["udid"]); raise SystemExit
          ')
          test -n "$UDID" || { echo "::error::no iPhone simulator available"; exit 1; }
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          echo "::notice::simulator $UDID"

      - name: Build (no signing)
        run: |
          set -o pipefail
          xcodebuild -project SacredPathway.xcodeproj -scheme SacredPathway \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath "$RUNNER_TEMP/dd" \
            -skipPackagePluginValidation -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO build 2>&1 | tee "$RUNNER_TEMP/build.log" | grep -E "error:|BUILD (SUCCEEDED|FAILED)" || true
          grep -E "^.*error:" "$RUNNER_TEMP/build.log" | head -40 | sed -E 's/^/::error::/' || true
          grep -q "BUILD SUCCEEDED" "$RUNNER_TEMP/build.log" && echo "::notice::BUILD SUCCEEDED" || { echo "::error::BUILD FAILED"; exit 1; }

      - name: Unit tests
        run: |
          set -o pipefail
          xcodebuild -project SacredPathway.xcodeproj -scheme SacredPathway \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath "$RUNNER_TEMP/dd" \
            -skipPackagePluginValidation -skipMacroValidation \
            -only-testing:SacredPathwayTests -resultBundlePath "$RUNNER_TEMP/tests.xcresult" \
            CODE_SIGNING_ALLOWED=NO test 2>&1 | tee "$RUNNER_TEMP/test.log" | grep -E "Executed|error:|failed|TEST (SUCCEEDED|FAILED)" | tail -40 || true
          grep -E "error:|: failed \(" "$RUNNER_TEMP/test.log" | head -40 | sed -E 's/^/::error::/' || true
          SUMMARY=$(grep -E "Executed [0-9]+ tests?" "$RUNNER_TEMP/test.log" | tail -1)
          echo "::notice::${SUMMARY:-no test summary found}"
          grep -q "TEST SUCCEEDED" "$RUNNER_TEMP/test.log" && echo "::notice::TEST SUCCEEDED" || { echo "::error::TEST FAILED"; exit 1; }

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcode-logs
          path: |
            ${{ runner.temp }}/build.log
            ${{ runner.temp }}/test.log
          if-no-files-found: ignore
